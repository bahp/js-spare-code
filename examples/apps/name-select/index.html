   function retrieveEntriesForPlayers(data, names) {
      return data.filter(entry =>
        !entry.hasOwnProperty('votes') ||            // Checks if votes key is not present
        entry.votes === undefined ||                 // Checks if votes is explicitly undefined
        (Object.keys(entry.votes).length === 0) ||   // Checks if votes is an empty object
        names.some(key => entry.votes[key] === true) // Contains any key with true value
    );
   }

   function retrieveVotesSummary(data) {
      // Initialize the dictionary
      var votesCount = {};

      // Iterate through the data array
      data.forEach(item => {
          if (item.votes) {
              // Iterate through the keys in the votes object
              for (var key in item.votes) {
                  if (item.votes.hasOwnProperty(key)) {
                      // Initialize key in dictionary if not present
                      if (!votesCount[key]) {
                          votesCount[key] = [0, 0]; // [countTrue, countFalse]
                      }

                      // Increment count based on the value
                      if (item.votes[key] === true) {
                          votesCount[key][0]++; // Increment count of true
                      } else if (item.votes[key] === false) {
                          votesCount[key][1]++; // Increment count of false
                      }
                  }
              }
          }
      });

      return votesCount;
   }

    String.prototype.format = function () {
      var i = 0, args = arguments;
      return this.replace(/{}/g, function () {
        return typeof args[i] != 'undefined' ? args[i++] : '';
      });
    };

   function populatePlayers(data) {
      /**
       * Populate the participants/players from data.
       **/

      // Get all players from data
      var allPlayers = data
        .filter(votes => votes !== undefined)
        .flatMap(item => item.votes ? Object.keys(item.votes) : []);

      // Create a Set to keep only unique vote names
      const uniquePlayers = [...new Set(allPlayers)];

      // Get votes summary
      const votesCount = retrieveVotesSummary(data)

      // Get the select dropdown element
      const selectElement = document.getElementById('playersDropdown');

      // Populate the select dropdown with unique tags
      uniquePlayers.forEach(tag => {
        const option = document.createElement('option');
        option.value = tag;
        option.textContent = tag;

        console.log('{}/{}/{}'.format(
          votesCount[tag][0],
          votesCount[tag][0] + votesCount[tag][1],
          data.length
        ))

        const fmt1 = "{} &#10003 | {} &#10005 | {} Total"
        const fmt2 = "{} selected | {} rejected | {} Total"
        option.setAttribute('data-subtext',
          fmt2.format(
            votesCount[tag][0],
            votesCount[tag][1],
            data.length
        ));
        selectElement.appendChild(option);
      });

      // Refresh the selectpicker to apply the changes
      $('.selectpicker').selectpicker('refresh')
   }

   function populateTags(data) {
      /**
      * Populate the tags from data.
      */
      // Get all tags from data
      var allTags = data
         .map(item => item.tags)
         .filter(tags => tags !== undefined)
         .flat();

      // Create a set to keep only unique tags
      var uniqueTags = [...new Set(allTags)];

      // Get the select dropdown element
      const selectElement = document.getElementById('tagsDropdown');

      // Populate the select dropdown with unique tags
      uniqueTags.forEach(tag => {
        const option = document.createElement('option');
        option.value = tag;
        option.textContent = tag;
        option.setAttribute('data-subtext', '1/2/200');
        selectElement.appendChild(option);
      });

      // Refresh the selectpicker to apply the changes
      $('.selectpicker').selectpicker('refresh')
      $('.selectpicker').selectpicker('selectAll');
   }

    function populateDatatable() {
        /**
         *
         **/

        // Clear the table
        if (table != null)
          table.clear().draw();

        // Extract unique vote keys
        const voteKeys = new Set();
        babyNames.forEach(person => {
            if (person.votes) {
                Object.keys(person.votes).forEach(key => voteKeys.add(key));
            }
        });
        const columns = Array.from(voteKeys);

        // Transform data for DataTable
        const tableData = babyNames.map(person => {
            const row = { name: person.name };
            columns.forEach(key => {
                if (person.votes && key in person.votes) {
                    row[key] = person.votes[key] ? '✓' : '✗';
                } else {
                    row[key] = ''; // Empty string for missing votes
                }
            });
            return row;
        });

        // Create table header
        const headerHtml = ['name', ...columns].map(col => `<th>${col}</th>`).join('');
        document.getElementById('header').innerHTML = headerHtml;

        // Create table body
        const bodyHtml = tableData.map(row => {
            const rowHtml = ['name', ...columns].map(col =>
              `<td>${row[col] !== undefined ? row[col] : ''}</td>`).join('');
            return `<tr>${rowHtml}</tr>`;
        }).join('');
        document.getElementById('body').innerHTML = bodyHtml;

        // Initialize DataTable
        var table = $('#example').DataTable();

    }

function handleTouchStart(evt) {
    startX = evt.touches[0].clientX;
}

function handleTouchMove(evt) {
    const card = evt.target;
    const touch = evt.touches[0];
    const change = touch.clientX - startX;

    card.style.transform = `translateX(${change}px)`;
    card.style.opacity = 1 - Math.abs(change) / cardContainer.offsetWidth;
}

function handleTouchEnd(evt) {
    const card = evt.target;
    const change = evt.changedTouches[0].clientX - startX;

    if (change < -100) {
        // Swipe left: remove
        card.style.transform = 'translateX(-100%)';
        card.style.opacity = 0;
        removeCard(card.dataset.id);
    } else if (change > 100) {
        // Swipe right: retain
        card.style.transform = 'translateX(100%)';
        card.style.opacity = 0;
        retainCard(card.dataset.id);
    } else {
        // Reset
        card.style.transform = 'translateX(0)';
        card.style.opacity = 1;
    }
}

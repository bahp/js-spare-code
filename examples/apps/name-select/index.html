    function createCard(item, idx) {

        card.appendChild(desc);

function handleTouchStart(evt) {
    startX = evt.touches[0].clientX;
}

function handleTouchMove(evt) {
    const card = evt.target;
    const touch = evt.touches[0];
    const change = touch.clientX - startX;

    card.style.transform = `translateX(${change}px)`;
    card.style.opacity = 1 - Math.abs(change) / cardContainer.offsetWidth;
}

function handleTouchEnd(evt) {
    const card = evt.target;
    const change = evt.changedTouches[0].clientX - startX;

    if (change < -100) {
        // Swipe left: remove
        card.style.transform = 'translateX(-100%)';
        card.style.opacity = 0;
        removeCard(card.dataset.id);
    } else if (change > 100) {
        // Swipe right: retain
        card.style.transform = 'translateX(100%)';
        card.style.opacity = 0;
        retainCard(card.dataset.id);
    } else {
        // Reset
        card.style.transform = 'translateX(0)';
        card.style.opacity = 1;
    }
}








    function decodeData(urlEncodedStr) {
        /*
        eyJrZXkxIjoidmFsdWUxIiwia2V5MiI6InZhbHVlMiJ9
        file:///Users/cbit/Desktop/repositories/github/js-spare-code/examples/apps/name-select/index.html?data=eyJrZXkxIjoidmFsdWUxIiwia2V5MiI6InZhbHVlMiJ9
         */
        // URL-decode the base64 string
        let base64Str = decodeURIComponent(urlEncodedStr);
        // Decode base64 to JSON string
        let jsonString = atob(base64Str);
        // Convert JSON string back to dictionary
        return JSON.parse(jsonString);
    }

    function encodeData(data) {
        // Convert dictionary to JSON string
        let jsonString = JSON.stringify(data);
        // Encode JSON string to base64
        let base64String = btoa(jsonString);
        // URL-encode the base64 string
        return encodeURIComponent(base64String);
